<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="320" viewBox="30 120 1440 320"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker></defs><rect x="30" y="120" width="1440" height="320" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c42}.label{font-size:15px;font-weight:700;letter-spacing:2px}.title{font-size:29px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#52657a}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><rect x="60" y="150" width="440" height="260" rx="16" fill="#eef6ff" stroke="#2b6cb0" stroke-opacity=".25"/><rect x="60" y="170" width="5" height="46" rx="2" fill="#2b6cb0"/><text x="85" y="190" class="label" style="fill:#2b6cb0">L1  /  DATA</text><text x="85" y="234" class="title" >Prepare observations</text><text x="85" y="283" class="body" style="font-size:19px">Access and validate sensor data</text><text x="85" y="320" class="body" style="font-size:19px">Apply source-specific preprocessing</text><text x="85" y="357" class="body" style="font-size:19px">Package consistent measurements</text><rect x="530" y="150" width="440" height="260" rx="16" fill="#edf8f4" stroke="#23806a" stroke-opacity=".25"/><rect x="530" y="170" width="5" height="46" rx="2" fill="#23806a"/><text x="555" y="190" class="label" style="fill:#23806a">L2  /  INFORMATION</text><text x="555" y="234" class="title" >Extract information</text><text x="555" y="283" class="body" style="font-size:19px">Compute features and events</text><text x="555" y="320" class="body" style="font-size:19px">Detect deviations or predict states</text><text x="555" y="357" class="body" style="font-size:19px">Return structured analytical results</text><rect x="1000" y="150" width="440" height="260" rx="16" fill="#f3effb" stroke="#7454a3" stroke-opacity=".25"/><rect x="1000" y="170" width="5" height="46" rx="2" fill="#7454a3"/><text x="1025" y="190" class="label" style="fill:#7454a3">L3  /  KNOWLEDGE</text><text x="1025" y="234" class="title" >Interpret in context</text><text x="1025" y="283" class="body" style="font-size:19px">Combine evidence and domain knowledge</text><text x="1025" y="320" class="body" style="font-size:19px">Relate results to the operator task</text><text x="1025" y="357" class="body" style="font-size:19px">Explain findings and suggest checks</text><path class="line" d="M500 275 H527"/><path class="line" d="M970 275 H997"/></svg>